[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi-hybrid-dataset"
version = "0.3.0"
description = "LUMI PSE 연구용 영상 합성 데이터셋과 조건부 GAN"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "opencv-python>=4.8,<5"]

[project.optional-dependencies]
precise = ["av>=13,<20"]
dev = ["pytest>=8"]
gan = ["torch>=2.2"]

[project.scripts]
lumi = "lumi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# 저장소에 .pytest_cache를 만들지 않는다(저장소에는 커밋 대상만 둔다).
addopts = "-p no:cacheprovider"

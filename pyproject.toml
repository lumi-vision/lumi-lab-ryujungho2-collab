[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi-hybrid-dataset"
version = "0.3.0"
description = "LUMI PSE 연구용 영상 합성 데이터셋과 조건부 GAN"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "opencv-python>=4.8,<5"]

[project.optional-dependencies]
precise = ["av>=13,<20"]
dev = ["pytest>=8"]
gan = ["torch>=2.2"]
notebook = ["pandas>=2", "ipykernel>=6"]

[project.scripts]
lumi = "lumi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
